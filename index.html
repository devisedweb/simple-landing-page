<html>
  <head>
    <title>Simple Landing Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-col">
        <div class="content">
          <h1>Got marketing? Advance your business insight.</h1>
          <p>Fill out the form and receive our award winning newsletter.</p>
        </div>
      </div>
      <div class="right-col">
        <div class="content form">
          <div class="input-wrapper">
            <label for="name">Name</label>
            <input type="text" name="name" id="name" />
          </div>

          <div class="input-wrapper">
            <label for="email">Email</label>
            <input type="text" name="email" id="email" />
          </div>

          <div class="input-wrapper"><button>Sign me up</button></div>
        </div>
      </div>
    </div>
  </body>
</html>
